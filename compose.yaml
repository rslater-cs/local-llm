services:
  llama:
    build:
      context: ./docker/llama.cpp
    container_name: llama
    restart: unless-stopped
    cpuset: "${LLAMA_CPUSET:-0-3}"
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/${MODEL_FILE}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${CONTEXT_SIZE:-4096}"
      - "-t"
      - "${LLAMA_THREADS:-4}"
      - "-tb"
      - "${LLAMA_THREADS_BATCH:-4}"
      - "-b"
      - "${LLAMA_BATCH_SIZE:-2048}"
      - "-ub"
      - "${LLAMA_UBATCH_SIZE:-512}"
      - "--flash-attn"
      - "auto"
      - "--cache-prompt"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://llama:8080/v1
      OPENAI_API_KEY: none
    depends_on:
      - llama
